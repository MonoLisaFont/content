<?xml version="1.0" encoding="UTF-8"?>
<svg width="1150" height="720" viewBox="0 0 1150 720" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MonoLisa Code vs. Fira Code summary infographic</title>
  <desc id="desc">A compact comparative infographic showing speaker coverage, script coverage, and OpenType feature signals for MonoLisa Code and Fira Code.</desc>
  <style>
    text {
      font-family: "MonoLisa", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      fill: var(--icon-primary, currentColor);
    }

    .eyebrow {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      fill: var(--icon-secondary, currentColor);
    }

    .title {
      font-size: 50px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subtitle {
      font-size: 20px;
      fill: var(--icon-secondary, currentColor);
    }

    .name {
      font-size: 34px;
      font-weight: 800;
    }

    .descriptor,
    .meta {
      font-size: 17px;
      fill: var(--icon-secondary, currentColor);
    }

    .bar-label {
      font-size: 24px;
      font-weight: 750;
    }

    .bar-value {
      font-size: 20px;
      fill: var(--icon-secondary, currentColor);
    }

    .bar-value.inside {
      text-anchor: end;
    }

    .group-label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      fill: var(--icon-secondary, currentColor);
    }

    .metric-label {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      fill: var(--icon-secondary, currentColor);
    }

    .metric-value {
      font-size: 22px;
      font-weight: 750;
    }

    .chip {
      font-size: 14px;
      font-weight: 800;
    }

    .section-title {
      font-size: 24px;
      font-weight: 850;
    }

    .body {
      font-size: 16px;
      fill: var(--icon-secondary, currentColor);
    }

    .rule {
      stroke: var(--icon-secondary, currentColor);
      stroke-opacity: 0.35;
      stroke-width: 1.25;
    }

    .top-rule {
      fill: var(--icon-primary, currentColor);
    }

    .speaker-bar,
    .chip-box rect {
      fill: var(--icon-primary, currentColor);
    }

    .speaker-bar.neutral,
    .chip-box.plain rect {
      opacity: 0.12;
    }

    .speaker-bar.left,
    .chip-box.strong rect {
      fill: var(--ml-colors-primary, var(--icon-primary, currentColor));
      opacity: 0.28;
    }

    .speaker-bar.right {
      opacity: 0.18;
    }
  </style>

  <path d="M66 40H1084" class="top-rule"/>
  <text x="66" y="78" class="eyebrow">Coding font comparison</text>
  <text x="66" y="138" class="title">MonoLisa Code vs. Fira Code</text>
  <text x="66" y="174" class="subtitle">Comparison signals for coding font selection</text>

  <g transform="translate(0 222)">
    <text x="66" y="-24" class="group-label">Hyperglot speaker coverage</text>

    <g transform="translate(66 0)">
      <rect width="1018" height="42" rx="0" class="speaker-bar neutral"/>
      <text x="16" y="28" class="bar-label">Hyperglot baseline: 7.38 billion</text>
      <text x="1002" y="28" class="bar-value inside">748 languages</text>
    </g>

    <g transform="translate(66 48)">
      <rect width="468" height="42" rx="0" class="speaker-bar left"/>
      <text x="16" y="28" class="bar-label">MonoLisa Code: 3.39 billion</text>
      <text x="486" y="28" class="bar-value">593 languages</text>
    </g>

    <g transform="translate(66 96)">
      <rect width="408" height="42" rx="0" class="speaker-bar right"/>
      <text x="16" y="28" class="bar-label">Fira Code: 2.96 billion</text>
      <text x="426" y="28" class="bar-value">395 languages</text>
    </g>
  </g>

  <g transform="translate(66 406)">
    <text x="0" y="0" class="name">MonoLisa Code</text>
    <text x="574" y="0" class="name">Fira Code</text>
    <text x="0" y="32" class="meta">593 languages · 10 weights · italics</text>
    <text x="574" y="32" class="meta">395 languages · 5 variable weights · no italics</text>

    <text x="0" y="88" class="group-label">Writing systems</text>
    <text x="574" y="88" class="group-label">Writing systems</text>

    <g class="chip-box strong" transform="translate(0 108)">
      <rect width="69" height="30" rx="15"/>
      <text x="34.5" y="20" text-anchor="middle" class="chip">Latin</text>
    </g>

    <g class="chip-box strong" transform="translate(79 108)">
      <rect width="96" height="30" rx="15"/>
      <text x="48" y="20" text-anchor="middle" class="chip">Cyrillic</text>
    </g>

    <g class="chip-box strong" transform="translate(185 108)">
      <rect width="78" height="30" rx="15"/>
      <text x="39" y="20" text-anchor="middle" class="chip">Hebrew</text>
    </g>

    <g class="chip-box strong" transform="translate(273 108)">
      <rect width="69" height="30" rx="15"/>
      <text x="34.5" y="20" text-anchor="middle" class="chip">Greek</text>
    </g>

    <g class="chip-box strong" transform="translate(352 108)">
      <rect width="96" height="30" rx="15"/>
      <text x="48" y="20" text-anchor="middle" class="chip">Armenian</text>
    </g>

    <g class="chip-box plain" transform="translate(574 108)">
      <rect width="69" height="30" rx="15"/>
      <text x="34.5" y="20" text-anchor="middle" class="chip">Latin</text>
    </g>

    <g class="chip-box plain" transform="translate(653 108)">
      <rect width="96" height="30" rx="15"/>
      <text x="48" y="20" text-anchor="middle" class="chip">Cyrillic</text>
    </g>

    <g class="chip-box plain" transform="translate(759 108)">
      <rect width="69" height="30" rx="15"/>
      <text x="34.5" y="20" text-anchor="middle" class="chip">Greek</text>
    </g>

    <text x="0" y="218" class="group-label">OpenType features</text>
    <text x="574" y="218" class="group-label">OpenType features</text>

    <g class="chip-box strong" transform="translate(0 238)">
      <rect width="60" height="30" rx="15"/>
      <text x="30" y="20" text-anchor="middle" class="chip">liga</text>
    </g>

    <g class="chip-box strong" transform="translate(70 238)">
      <rect width="60" height="30" rx="15"/>
      <text x="30" y="20" text-anchor="middle" class="chip">dlig</text>
    </g>

    <g class="chip-box strong" transform="translate(140 238)">
      <rect width="60" height="30" rx="15"/>
      <text x="30" y="20" text-anchor="middle" class="chip">calt</text>
    </g>

    <g class="chip-box strong" transform="translate(210 238)">
      <rect width="60" height="30" rx="15"/>
      <text x="30" y="20" text-anchor="middle" class="chip">zero</text>
    </g>

    <g class="chip-box strong" transform="translate(280 238)">
      <rect width="105" height="30" rx="15"/>
      <text x="52.5" y="20" text-anchor="middle" class="chip">ss01-ss15</text>
    </g>

    <g class="chip-box strong" transform="translate(395 238)">
      <rect width="105" height="30" rx="15"/>
      <text x="52.5" y="20" text-anchor="middle" class="chip">cv01-cv12</text>
    </g>

    <g class="chip-box plain" transform="translate(574 238)">
      <rect width="60" height="30" rx="15"/>
      <text x="30" y="20" text-anchor="middle" class="chip">calt</text>
    </g>

    <g class="chip-box plain" transform="translate(644 238)">
      <rect width="60" height="30" rx="15"/>
      <text x="30" y="20" text-anchor="middle" class="chip">zero</text>
    </g>

    <g class="chip-box plain" transform="translate(714 238)">
      <rect width="105" height="30" rx="15"/>
      <text x="52.5" y="20" text-anchor="middle" class="chip">ss01-ss10</text>
    </g>

    <g class="chip-box plain" transform="translate(829 238)">
      <rect width="105" height="30" rx="15"/>
      <text x="52.5" y="20" text-anchor="middle" class="chip">cv01-cv32</text>
    </g>
  </g>

  <g transform="translate(66 680)">
    <line x1="0" y1="0" x2="1018" y2="0" class="rule"/>
    <text x="0" y="24" class="body">Language counts: Hyperglot 0.8.1, primary living orthographies, base character support.</text>
  </g>
</svg>
